---
# Realm's build of mrml-ruby at 840f48d (mrml 6.0.1), which upstream hasn't released yet.
# Precompiled for the platforms and Rubies Realm runs; the gems are published to Realm's gem bucket.
name: Cross Compile

on:
  push:
    tags:
      - "v*"

jobs:
  cross-gem:
    name: Compile native gem for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x86_64-linux, aarch64-linux, arm64-darwin, x86_64-darwin]
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: "3.4,4.0"

      - uses: actions/upload-artifact@v7
        with:
          name: mrml-ruby-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}
  source-gem:
    name: Build source gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - run: gem build mrml.gemspec

      - uses: actions/upload-artifact@v7
        with:
          name: mrml-ruby-ruby
          path: "*.gem"
  merge-artifacts:
    name: Merge artifacts
    runs-on: ubuntu-latest
    needs: [cross-gem, source-gem]
    steps:
      - uses: actions/upload-artifact/merge@v7
        with:
          name: cross-gem
          pattern: mrml-ruby-*
